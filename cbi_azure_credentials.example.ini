# ==============================================================================
# AZURE / FABRIC CREDENTIALS — TEMPLATE
#
# 1. Copy this file to "cbi_azure_credentials.ini" (same folder as
#    cbi_export_to_fabric.py).
# 2. Fill in values from an Azure AD App Registration (service principal)
#    that has "Storage Blob Data Contributor" on the target storage
#    account/Fabric workspace's OneLake. Your Azure admin / Fabric admin
#    sets this up in the Azure Portal (App registrations) and Fabric
#    workspace access settings.
# 3. Never commit cbi_azure_credentials.ini to git — it is in .gitignore
#    alongside cbi_credentials.ini.
# ==============================================================================

[azure]
tenant_id=REPLACE_WITH_YOUR_AZURE_TENANT_ID
client_id=REPLACE_WITH_YOUR_APP_REGISTRATION_CLIENT_ID
client_secret=REPLACE_WITH_YOUR_APP_REGISTRATION_SECRET
storage_account=REPLACE_WITH_YOUR_STORAGE_ACCOUNT_NAME
container=REPLACE_WITH_CONTAINER_OR_LAKEHOUSE_NAME
